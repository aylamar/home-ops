---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 3
  # VectorChord-enabled PostgreSQL for Immich 3.0+ (migrated from pgvecto.rs)
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16.14
  # imageName: ghcr.io/cloudnative-pg/postgresql:16.2
  primaryUpdateStrategy: unsupervised
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  storage:
    size: 32Gi
    storageClass: ceph-block
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
    parameters:
      max_connections: "200"
      shared_buffers: 256MB
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
  resources:
    requests:
      cpu: 500m
      memory: 1024Mi
    limits:
      memory: 2048Mi
  monitoring:
    enablePodMonitor: true
  backup:
    retentionPolicy: 14d
    barmanObjectStore: &barmanObjectStore
      data:
        compression: bzip2
      wal:
        compression: bzip2
        maxParallel: 4
      destinationPath: s3://cloudnative-pg/
      endpointURL: http://192.168.10.42:9000/
      # Note: serverName version needs to be inccemented
      # when recovering from an existing cnpg cluster
      serverName: &currentCluster postgres-v4
      s3Credentials:
        accessKeyId:
          name: cloudnative-pg-secret
          key: s3_access_key
        secretAccessKey:
          name: cloudnative-pg-secret
          key: s3_secret_access_key
  bootstrap:
    recovery:
      source: &previousCluster postgres-v3
  # Note: externalClusters is needed when recovering from an existing cnpg cluster
  externalClusters:
    - name: *previousCluster
      barmanObjectStore:
        <<: *barmanObjectStore
        serverName: *previousCluster
  inheritedMetadata:
    annotations:
      kyverno.io/exclude: "true"
